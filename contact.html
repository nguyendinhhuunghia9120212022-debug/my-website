<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Yêu cầu 25: Title (50-60 ký tự) -->
    <title>Liên hệ - NGUYỄN ĐÌNH HỮU NGHĨA — Gửi tin nhắn, email hoặc gọi điện thoại</title>
    
    <meta name="description" content="Gửi tin nhắn, liên hệ qua email hoặc số điện thoại với 
    NGUYỄN ĐÌNH HỮU NGHĨA — điền biểu mẫu để nhận phản hồi nhanh chóng và thuận tiện.">
    
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-inter">
    <header>
        <h1>NGUYỄN ĐÌNH HỮU NGHĨA</h1>
        <p>Website giới thiệu cá nhân của tôi</p>
    </header>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="contact.html">Liên hệ</a>
        <a href="https://github.com/nguyendinhhuunghia9120212022-debug/my-website" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <main>
        <form action="#" method="post" class="card">
            <h2>Liên hệ</h2>
            
            <!-- Fieldset 1: Thông tin cá nhân -->
            <fieldset>
                <legend>Thông tin cá nhân</legend>
                
                <div class="form-group">
                    <label for="hoten">Họ và tên:</label>
                    <input type="text" id="hoten" name="hoten" required minlength="2">
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="dienthoai">Điện thoại:</label>
                    <input type="tel" id="dienthoai" name="dienthoai" 
                           pattern="[0-9]{10,11}" title="Số điện thoại phải có 10-11 chữ số">
                </div>
                
                <!-- Yêu cầu 23: Ngày sinh -->
                <div class="form-group">
                    <label for="ngaysinh">Ngày sinh:</label>
                    <input type="date" id="ngaysinh" name="ngaysinh">
                </div>
                
                <!-- Yêu cầu 24: Trường đại học với datalist -->
                <div class="form-group">
                    <label for="truongdaihoc">Trường đại học:</label>
                    <input type="text" id="truongdaihoc" name="truongdaihoc" list="danhsach-truong">
                    <datalist id="danhsach-truong">
                        <option value="Đại học Công nghệ TP.HCM"></option>
                        <option value="Đại học Khoa học Tự nhiên"></option>
                        <option value="Đại học Bách khoa TP.HCM"></option>
                        <option value="Đại học Kinh tế TP.HCM"></option>
                    </datalist>
                </div>
            </fieldset>
            
            <!-- Fieldset 2: Nội dung liên hệ -->
            <fieldset>
                <legend>Nội dung liên hệ</legend>
                
                <div class="form-group">
                    <label>Liên hệ qua:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="lienhe" value="email"> Email</label>
                        <label><input type="radio" name="lienhe" value="dienthoai"> Điện thoại</label>
                        <label><input type="radio" name="lienhe" value="zalo"> Zalo</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="noidung">Nội dung:</label>
                    <textarea id="noidung" name="noidung" rows="5" required minlength="10"></textarea>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="dongy" name="dongy" required>
                        Tôi đồng ý nhận phản hồi
                    </label>
                </div>
            </fieldset>
            
            <!-- Nút Gửi & Xóa -->
            <div class="form-buttons">
                <button type="submit">Gửi</button>
                <button type="reset">Xóa tất cả</button>
            </div>
        </form>
    </main>

</body>
</html>
